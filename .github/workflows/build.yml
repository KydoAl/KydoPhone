name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          if [ -f "KydoPhone-1.1.0-improved.zip" ]; then
            echo "Extracting project ZIP..."
            unzip -o KydoPhone-1.1.0-improved.zip -d extracted_temp
            # Move extracted contents (including hidden files) to the repository root
            shopt -s dotglob
            cp -rn extracted_temp/KydoPhone/* . 2>/dev/null || cp -rn extracted_temp/* .
            rm -rf extracted_temp
          else
            echo "ZIP file not found, proceeding with repository files."
          fi
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
